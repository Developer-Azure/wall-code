<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
<style>
    :root {
        --font-family: "Cedarville Cursive", cursive;
        --azure-primary-color: #ff0000;
        --azure-secondary-color: #FFbF00;
        --azure-text-color: #FFFFFF;
        --azure-secondary-text-color: #909090;
        --azure-background: linear-gradient(to bottom, var(--azure-primary-color), var(--azure-secondary-color));
    }

    .background {
        background: var(--azure-background);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        color: var(--azure-text-color);
        padding-top: 60px;
        padding-bottom: 60px;
        width: 100%;
        box-sizing: border-box;

        font-family: var(--font-family);
        font-optical-sizing: auto;
        font-weight: 450;
        font-style: normal;
        text-align: center;
    }

    h1, h3 {
        margin: 0;
        padding: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
    }

    .divider {
        width: 75%;
        height: 1px;
        margin-top: 30px;
        margin-bottom: 30px;
        background-color: var(--azure-text-color);
    }

    .divider-no-color {
        width: 75%;
        height: 3px;
        margin-top: 30px;
        margin-bottom: 30px;
    }

    .section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: auto;
        box-sizing: border-box;
        padding-left: 16px;
        padding-right: 16px;
    }

    .text-section {
        display: flex;
        flex-direction: column;
        width: min(100%, 42rem);
        box-sizing: border-box;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .text-section a {
        display: block;
        max-width: 100%;
        overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
        .background {
            padding-top: 32px;
            padding-bottom: 32px;
        }

        h1 {
            font-size: clamp(1.5rem, 7vw, 2rem);
        }

        h3 {
            font-size: clamp(1.1rem, 5vw, 1.4rem);
        }
    }
</style>
<div class="background">
    <div class="section">
        <h1>Hi guys my name's Ash-claw :3</h1>
        <h3>and this is my wall</h3>
        <div class="divider"></div>
    </div> 
</div>
